[project]
name = "atoms"
version = "0.1.0"
description = "Mini tools for building big things"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "César Medina", email = "cesar.medina@innovox.com.br" },
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.7",
    "django-cors-headers>=4.9.0",
    "django-tenants>=3.10.2",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "python-decouple>=3.8",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "boto3>=1.34.0",
    "moto[s3]>=5.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-django>=0.65b0",
    "opentelemetry-instrumentation-requests>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
]

# ------------------------------
# 🔁 Versioning and Release Management
# ------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "./__init__.py"

[tool.hatch.build.targets.sdist]
include = [".", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.9.0",
]

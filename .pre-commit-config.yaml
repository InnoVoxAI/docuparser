repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Remove trailing whitespace
        description: This hook removes trailing whitespace.
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: debug-statements
        language_version: python3
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json


  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.16
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
        files: &py_projects '^docuparse-project/(backend-com|backend-core|backend-ocr|langextract-service|contracts|shared|layout-service)/'
      # Run the formatter.
      - id: ruff-format
        files: *py_projects


  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py312-plus]
        files: *py_projects

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.3
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: frontend-eslint
        name: Frontend ESLint (--fix)
        entry: bash -c 'cd docuparse-project/frontend && npx eslint . --fix'
        language: system
        files: ^docuparse-project/frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: frontend-prettier
        name: Frontend Prettier (--write)
        entry: bash -c 'cd docuparse-project/frontend && npx prettier --write .'
        language: system
        files: ^docuparse-project/frontend/.*\.(ts|tsx|css|json)$
        pass_filenames: false

      - id: frontend-typecheck
        name: Frontend typecheck (tsc --noEmit)
        entry: bash -c 'cd docuparse-project/frontend && npx tsc --noEmit -p .'
        language: system
        files: ^docuparse-project/frontend/.*\.(ts|tsx)$
        pass_filenames: false

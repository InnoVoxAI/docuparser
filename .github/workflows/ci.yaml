name: "CI"

on:
  push:
    branches:
      - main
      - staging
    paths:
      - "docuparse-project/**"
      - "pyproject.toml"
      - "!docuparse-project/frontend/**"
  # Válvula de escape (AR-21): disparo manual na aba Actions, só em main ou staging.
  # Com skip_tests=true o deploy sai sem os testes de backend. Use só em
  # emergência, por exemplo se o Backend CI quebrar por causa do runner e não do código.
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Pular os testes de backend (emergência)"
        type: boolean
        default: false

jobs:
  # AR-21: o build de imagem só roda depois dos testes de backend (AR-20).
  backend-tests:
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/backend-ci.yaml

  pre-deploy:
    needs: backend-tests
    # !cancelled() porque backend-tests fica "skipped" quando skip_tests=true. Sem
    # uma função de status, o pre-deploy seria pulado junto. Testes falhos ou
    # cancelados barram o deploy. O ref é checado porque o disparo manual aceita
    # qualquer branch.
    if: >-
      ${{ !cancelled()
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
      && (needs.backend-tests.result == 'success'
      || (needs.backend-tests.result == 'skipped' && inputs.skip_tests)) }}
    runs-on: ubuntu-latest
    outputs:
      IMAGE_VERSION: ${{ steps.extract_version.outputs.IMAGE_VERSION }}
      SKIP: ${{ steps.check_version.outputs.SKIP }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCOUNT_MODIFY_TOKEN }}
          fetch-depth: 0

      - name: Install UV
        uses: astral-sh/setup-uv@v5

      - name: Install pyproject-parser
        run: uv tool install "pyproject-parser[cli]"

      - name: Get Version from pyproject.toml
        id: extract_version
        run: |
          VERSION=$(pyproject-info project.version | tr -d '"')
          echo "IMAGE_VERSION=$VERSION" >> $GITHUB_OUTPUT

  # Os deploys têm `if` explícito: com backend-tests "skipped", o padrão (success())
  # pularia todos, porque o skip de um ancestral se propaga.
  deploy-core:
    needs: pre-deploy
    if: ${{ !cancelled() && needs.pre-deploy.result == 'success' }}
    uses: ./.github/workflows/deploy.yaml
    with:
      IMAGE_NAME: docuparser-core
      IMAGE_VERSION: ${{ needs.pre-deploy.outputs.IMAGE_VERSION }}
      ENVIRONMENT: docuparser-core
      BACKEND_DIR: docuparse-project
      DOCKERFILE_PATH: docuparse-project/backend-core/Dockerfile
    secrets:
      ACCOUNT_MODIFY_TOKEN: ${{ secrets.ACCOUNT_MODIFY_TOKEN }}
      INNOVOX_USERNAME: ${{ secrets.INNOVOX_USERNAME }}
      INNOVOX_PASSWORD: ${{ secrets.INNOVOX_PASSWORD }}

  # Runs after deploy-core to avoid concurrent pushes to the gitops branch
  deploy-com:
    needs: [pre-deploy, deploy-core]
    if: ${{ !cancelled() && needs.deploy-core.result == 'success' }}
    uses: ./.github/workflows/deploy.yaml
    with:
      IMAGE_NAME: docuparser-com
      IMAGE_VERSION: ${{ needs.pre-deploy.outputs.IMAGE_VERSION }}
      ENVIRONMENT: docuparser-com
      BACKEND_DIR: docuparse-project
      DOCKERFILE_PATH: docuparse-project/backend-com/Dockerfile
    secrets:
      ACCOUNT_MODIFY_TOKEN: ${{ secrets.ACCOUNT_MODIFY_TOKEN }}
      INNOVOX_USERNAME: ${{ secrets.INNOVOX_USERNAME }}
      INNOVOX_PASSWORD: ${{ secrets.INNOVOX_PASSWORD }}

  deploy-ocr:
    needs: [pre-deploy, deploy-com]
    if: ${{ !cancelled() && needs.deploy-com.result == 'success' }}
    uses: ./.github/workflows/deploy.yaml
    with:
      IMAGE_NAME: docuparser-ocr
      IMAGE_VERSION: ${{ needs.pre-deploy.outputs.IMAGE_VERSION }}
      ENVIRONMENT: docuparser-ocr
      BACKEND_DIR: docuparse-project
      DOCKERFILE_PATH: docuparse-project/backend-ocr/Dockerfile
    secrets:
      ACCOUNT_MODIFY_TOKEN: ${{ secrets.ACCOUNT_MODIFY_TOKEN }}
      INNOVOX_USERNAME: ${{ secrets.INNOVOX_USERNAME }}
      INNOVOX_PASSWORD: ${{ secrets.INNOVOX_PASSWORD }}

  deploy-langextract:
    needs: [pre-deploy, deploy-ocr]
    if: ${{ !cancelled() && needs.deploy-ocr.result == 'success' }}
    uses: ./.github/workflows/deploy.yaml
    with:
      IMAGE_NAME: docuparser-langextract
      IMAGE_VERSION: ${{ needs.pre-deploy.outputs.IMAGE_VERSION }}
      ENVIRONMENT: docuparser-langextract
      BACKEND_DIR: docuparse-project
      DOCKERFILE_PATH: docuparse-project/langextract-service/Dockerfile
    secrets:
      ACCOUNT_MODIFY_TOKEN: ${{ secrets.ACCOUNT_MODIFY_TOKEN }}
      INNOVOX_USERNAME: ${{ secrets.INNOVOX_USERNAME }}
      INNOVOX_PASSWORD: ${{ secrets.INNOVOX_PASSWORD }}

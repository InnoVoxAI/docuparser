[project]
name = "atoms"
version = "0.1.0"
description = "Backend Core"
readme = "README.md"
license = { text = "MIT" }
authors = []
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.57",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "openai>=2.48.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "pypdfium2>=5.12.1",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.51.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
]

[project.optional-dependencies]
complete = [
    "easyocr>=1.7.2",
    "paddleocr>=2.10.0",
    "paddlepaddle>=3.3.1",
]
trocr = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
]


# ------------------------------
# 🔁 Versioning and Release Management
# ------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "./__init__.py"

[tool.hatch.build.targets.sdist]
include = [".", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

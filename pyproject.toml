[project]
name = "docuparser"
version = "0.0.6"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agent>=0.1.3",
    "beautifulsoup4>=4.14.3",
    "docling>=2.91.0",
    "fastapi>=0.135.3",
    "fitz>=0.0.1.dev2",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "lxml>=6.1.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "pymupdf>=1.27.2.3",
    "pypdfium2>=5.7.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.26",
    "requests>=2.33.1",
    "typer>=0.21.2",
]

[tool.ruff]
# Fase A (spec 012) package. Constitution I. Code Quality.
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer/Click usam Option()/Argument() como defaults — padrão idiomático, não bug.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
markers = [
    "unit: pure-logic tests that do not touch network or disk",
]
